<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Drop Shadow Filter for cards and title -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#titleGrad);
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 16px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      stroke-dasharray: 4 4;
    }
    .circuit-node {
      fill: #38bdf8;
      transition: all 0.5s;
    }
    .circuit-wire {
      stroke: #334155;
      stroke-width: 1.5;
      fill: none;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Elements (Lower layer) -->
  <!-- Ambient floating radial glows -->
  <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.12">
    <animate attributeName="r" values="120;160;120" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="8s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="280" r="160" fill="#6366f1" opacity="0.12">
    <animate attributeName="r" values="140;180;140" dur="10s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Technical Circuit Grid Lines -->
  <g opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="360" class="grid-line" />
    <line x1="280" y1="0" x2="280" y2="360" class="grid-line" />
    <line x1="920" y1="0" x2="920" y2="360" class="grid-line" />
    <line x1="1120" y1="0" x2="1120" y2="360" class="grid-line" />
    <line x1="0" y1="70" x2="1200" y2="70" class="grid-line" />
    <line x1="0" y1="290" x2="1200" y2="290" class="grid-line" />
  </g>

  <!-- Moving Data Pulses along circuit traces -->
  <path d="M 60 70 L 280 70 L 340 130 L 340 230 L 280 290 L 60 290" class="circuit-wire" />
  <circle r="4" fill="#38bdf8" filter="url(#glow)">
    <animateMotion path="M 60 70 L 280 70 L 340 130 L 340 230 L 280 290 L 60 290" dur="6s" repeatCount="indefinite" />
  </circle>

  <path d="M 1140 70 L 920 70 L 860 130 L 860 230 L 920 290 L 1140 290" class="circuit-wire" />
  <circle r="4" fill="#818cf8" filter="url(#glow)">
    <animateMotion path="M 1140 70 L 920 70 L 860 130 L 860 230 L 920 290 L 1140 290" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Center Decorative Glow Line -->
  <rect x="250" y="228" width="700" height="2" fill="url(#cyanLine)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Dynamic Rotating Radar/Reticle Rings in Background -->
  <g transform="translate(600, 150)" opacity="0.25">
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="30s" repeatCount="indefinite" />
    </circle>
    <circle r="135" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="24 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- FOREGROUND CONTENT: Safe from overlapping dynamic elements -->
  <!-- Header Pill Badge -->
  <g transform="translate(435, 42)" filter="url(#shadow)">
    <rect width="330" height="34" rx="17" fill="url(#badgeGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="fill" values="#38bdf8;#818cf8;#38bdf8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="22" class="pill-text">ROBOTICS &amp; EMBEDDED CONTROL</text>
  </g>

  <!-- Main Banner Title (Sharp and in foreground) -->
  <g filter="url(#shadow)">
    <text x="600" y="132" text-anchor="middle" class="title-text">Awesome Robotics Frameworks</text>
    <text x="600" y="172" text-anchor="middle" class="title-text" font-size="34" fill="#f8fafc">&amp; Embedded Control</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" class="subtitle-text">
    Deterministic RTOS • Robotics Middleware • Physics Simulators • SLAM Navigation • Fleet RobOps
  </text>

  <!-- Tag Pills Row (Foreground) -->
  <g transform="translate(180, 260)" filter="url(#shadow)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">ROS 2 &amp; Zenoh</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(150, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">Zephyr &amp; FreeRTOS</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(310, 0)">
      <rect width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="67" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">PX4 &amp; ArduPilot</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(460, 0)">
      <rect width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="75" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c084fc">Gazebo &amp; MuJoCo</text>
    </g>
    <!-- Pill 5 -->
    <g transform="translate(625, 0)">
      <rect width="145" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="72" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">Nav2 &amp; MoveIt 2</text>
    </g>
    <!-- Pill 6 -->
    <g transform="translate(785, 0)">
      <rect width="125" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="62" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">RobOps &amp; MCAP</text>
    </g>
  </g>
</svg>